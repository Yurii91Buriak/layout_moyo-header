<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo logo"
          class="logo__img"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item nav__item--apple is-active">
            <a href="#">Apple</a>
          </li>
          <li class="nav__item nav__item--samsung">
            <a href="#">Samsung</a>
          </li>
          <li class="nav__item nav__item--smartphones">
            <a href="#">Smartphones</a>
          </li>
          <li class="nav__item nav__item--laptops-computers">
            <a
              href="#"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav__item nav__item--gadgets">
            <a href="#">Gadgets</a>
          </li>
          <li class="nav__item nav__item--tablets">
            <a href="#">Tablets</a>
          </li>
          <li class="nav__item nav__item--photo">
            <a href="#">Photo</a>
          </li>
          <li class="nav__item nav__item--video">
            <a href="#">Video</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
